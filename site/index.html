<!doctype html>
<html lang="en" class="meridian-page">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Explore all Meridian UI components with live Gleam and Lustre examples, source code, light and dark themes and RTL previews."
    />
    <meta name="theme-color" content="#b41472" />
    <title>Meridian UI - Component catalogue</title>
    <link rel="icon" href="./assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./meridian-ui.css" />
    <link rel="stylesheet" href="./catalogue.css" />
  </head>
  <body
    id="docs-root"
    class="meridian-ui docs"
    data-theme="light"
    data-preview-version=""
  >
    <a class="docs-skip" href="#main">Skip to content</a>
    <header class="docs-header">
      <a class="docs-brand" href="#/" aria-label="Meridian UI home">
        <img src="./assets/mark.svg" width="32" height="32" alt="" />
        <span>Meridian <span class="muted">UI</span></span>
      </a>
      <span class="docs-header-note">
        <svg
          class="meridian-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path
            d="m9 2 2 7 7 2-7 2-2 7-2-7-5-2 5-2Zm10 11 1 4 3 1-3 1-1 4-1-4-3-1 3-1Z"
          />
        </svg>
        Gleam + Lustre
      </span>
      <div class="docs-tools">
        <button
          id="direction"
          class="button"
          type="button"
          aria-pressed="false"
        >
          RTL
        </button>
        <button
          id="theme"
          class="icon-button theme-toggle"
          type="button"
          aria-label="Theme: System. Switch to light theme"
        ></button>
        <a
          class="docs-github"
          href="https://github.com/natalie-o-perret/gleam-lustre-meridian-ui"
          ><span id="github-icon" aria-hidden="true"></span> GitHub
          <span aria-hidden="true">↗</span></a
        >
        <button
          id="open-navigation"
          class="button docs-mobile"
          type="button"
          aria-haspopup="dialog"
          aria-controls="navigation-dialog"
        >
          Components
        </button>
      </div>
    </header>
    <aside id="navigation-panel" class="docs-sidebar" aria-label="Catalogue">
      <div id="navigation-content">
        <label class="docs-search" for="component-search">
          <span class="sr-only">Search components</span>
          <input
            id="component-search"
            class="input"
            type="search"
            placeholder="Find a component..."
            autocomplete="off"
            aria-controls="component-navigation"
          />
          <kbd aria-hidden="true">/</kbd>
        </label>
        <p id="search-status" class="docs-count muted" role="status">
          Loading catalogue...
        </p>
        <label class="docs-style" for="style"
          >Library style
          <select id="style" class="input">
            <option value="rounded">Rounded</option>
            <option value="square">Squared</option>
            <option value="playful">Playful</option>
            <option value="fantasy">Fantasy</option>
          </select>
        </label>
        <div class="docs-colours">
          <label for="primary-colour"
            >Primary / accent<span class="docs-colour-control"
              ><input
                id="primary-colour"
                aria-label="Primary / accent"
                class="input meridian-colour"
                type="color"
                value="#b41472"
              /><code id="primary-colour-value" aria-hidden="true"
                >#b41472</code
              ></span
            ></label
          >
          <label for="secondary-colour"
            >Secondary<span class="docs-colour-control"
              ><input
                id="secondary-colour"
                aria-label="Secondary"
                class="input meridian-colour"
                type="color"
                value="#316a91"
              /><code id="secondary-colour-value" aria-hidden="true"
                >#316a91</code
              ></span
            ></label
          >
          <button id="reset-colours" class="button" type="button">
            Reset colours
          </button>
        </div>
        <nav
          id="component-navigation"
          aria-label="Components"
          data-meridian-keys="accordion"
          data-orientation="vertical"
        ></nav>
      </div>
    </aside>
    <dialog id="navigation-dialog" aria-label="Component navigation">
      <div class="docs-dialog-heading">
        <strong>Components</strong
        ><button id="close-navigation" class="button" type="button">
          Close
        </button>
      </div>
    </dialog>
    <main id="main" class="docs-main" tabindex="-1" aria-busy="true">
      <p>Loading catalogue...</p>
    </main>
    <footer class="docs-footer muted">
      Independent components. Native foundations. No remote fonts or CDN
      engines.
      <a href="./licences.txt">Open-source notices</a>
    </footer>
    <noscript
      ><p>
        This interactive catalogue needs JavaScript.
        <a
          href="https://github.com/natalie-o-perret/gleam-lustre-meridian-ui/blob/main/COMPONENTS.md"
          >Read the component coverage and source on GitHub.</a
        >
      </p></noscript
    >
    <script type="module" src="./assets/catalogue.js"></script>
  </body>
</html>
