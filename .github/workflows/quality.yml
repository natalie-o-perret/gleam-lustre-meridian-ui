name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set up Gleam and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          gleam-version: "1.19.2"
          otp-version: "29.1.2"
          rebar3-version: "3.28.0"
      - run: npm ci --ignore-scripts
      - run: make check

  browser:
    name: ${{ matrix.suite.name }} (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        suite:
          - name: Library
            build: gleam test
            script: test:browser
          - name: Catalogue
            build: npm run build:site
            script: test:site:browser
    env:
      BROWSER: ${{ matrix.browser }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Set up Gleam and Erlang
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          gleam-version: "1.19.2"
          otp-version: "29.1.2"
          rebar3-version: "3.28.0"
      - run: npm ci --ignore-scripts
      - run: ${{ matrix.suite.build }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run ${{ matrix.suite.script }}
